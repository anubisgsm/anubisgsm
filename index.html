<style>
        /* (Önceki stiller aynı kalmıştır, header ve logo ile ilgili kısımlar güncellendi:) */

        header {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: var(--text-main);
            padding: 35px 20px; /* Üst alt boşluk artırıldı */
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Logo ve yazı arasındaki mesafe artırıldı */
            cursor: pointer;
            user-select: none;
            padding: 10px 20px;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .logo-container:hover { transform: scale(1.02); }
        
        /* Ana logo boyutu büyütüldü */
        .logo-container img {
            height: 90px; 
            width: auto;
            filter: drop-shadow(0 0 12px var(--accent-gold-glow));
        }

        /* Başlık yazısı büyütüldü */
        header h1 {
            margin: 0;
            font-size: 38px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-weight: 800;
        }

        /* Alt slogan yazısı büyütüldü */
        header p {
            margin: 6px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        @media screen and (max-width: 768px) {
            header { padding: 20px 10px; }
            header h1 { font-size: 26px; } /* Mobilde oranlı büyüklük */
            header p { font-size: 11px; }
            .logo-container img { height: 65px; } /* Mobilde logo boyutu */
        }
    </style>

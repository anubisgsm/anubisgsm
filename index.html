    <style>
        :root {
            --bg-deep: #f8fafc;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --primary-color: #0284c7;
            --accent-gold: #d97706;
            --accent-gold-glow: rgba(217, 119, 6, 0.2);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: rgba(15, 23, 42, 0.08);
            --whatsapp-color: #10b981;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 70px; 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 132, 199, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(217, 119, 6, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            color: var(--text-main);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            user-select: none;
            padding: 5px 15px;
            border-radius: 12px;
            transition: transform 0.3s;
        }
        .logo-container:hover { transform: scale(1.02); }
        .logo-container img {
            height: 65px;
            width: auto;
            filter: drop-shadow(0 0 10px var(--accent-gold-glow));
        }
        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 800;
        }
        header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .container {
            max-width: 1250px;
            margin: 25px auto;
            padding: 0 20px;

        .admin-panel {
            display: none;
            background: var(--bg-card);
            border: 2px dashed var(--accent-gold);

            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);

        .admin-panel h3 {
            margin-top: 0;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }
        .close-admin {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .close-admin:hover { background: #dc2626; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-grid input, .form-grid select {
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }
        .form-grid input:focus { border-color: var(--accent-gold); }
        
        .admin-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .admin-btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;

        .sticky-top-section {

            background: var(--bg-deep);
            padding-top: 10px;
            padding-bottom: 10px;
            backdrop-filter: blur(8px);

        .rate-container {

            padding: 15px 25px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            flex-wrap: wrap;
            gap: 15px;

        .rate-box {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-gold);
        }
        .rate-input {
            width: 120px;
            padding: 8px 12px;
            font-size: 16px;
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            background: #fffbeb;
            color: var(--accent-gold);
            outline: none;

        .live-rate-display {

            font-weight: 700;

            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);

        .search-box:focus {

            box-shadow: 0 0 15px var(--accent-gold-glow);

        .faq-open-btn {

        .mobile-nav-item.active svg, .mobile-nav-item:hover svg {

                <input type="text" id="newStock" placeholder="Stok (Örn: HAZIR STOK)">
                <input type="text" id="newDesc" placeholder="Cihaz Açıklaması">
            </div>
            <button class="admin-btn" onclick="addNewProduct()">Listeye Ürün Ekle</button>
        </div>

        <div class="sticky-top-section">
            <div class="rate-container">
                <div class="rate-box">
                    <span>GÜNCEL KUR:</span>
                    <input type="number" id="dollarRate" class="rate-input" value="43.169" step="0.001" readonly title="Bu kur otomatik çekilir. Değiştirmek için Yönetim Paneli şifresini giriniz.">
                </div>
                <div id="liveRateText" class="live-rate-display">CANLI KUR: Yükleniyor...</div>
                <div class="update-date">SON GÜNCELLEME: 31.07.2026</div>
            </div>

            <div class="controls-wrapper">
                <input type="text" id="searchInput" class="search-box" placeholder="Cihaz veya model ara (Örn: iPhone 16, S25 Ultra, Xiaomi)..." onkeyup="filterTable()">
                <button class="faq-open-btn" onclick="openFaqModal()">
                    ❓ Sıkça Sorulan Sorular
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="priceTable">
                <thead>
                    <tr>
                        <th>MODEL</th>
                        <th>HAFIZA</th>
                        <th>KAYIT DURUMU</th>
                        <th>DOLAR ($)</th>
                        <th>TL (₺)</th>
                        <th>STOK DURUMU</th>
                        <th>SİPARİŞ</th>
                        <th class="admin-col">İŞLEM</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
